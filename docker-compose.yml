# Database: use Supabase (set DATABASE_URL) or local Postgres (--profile local).
#   With Supabase:  docker compose up -d   (only auth-service; set DATABASE_URL in .env)
#   Local Postgres: docker compose --profile local up -d

services:
  auth-db:
    profiles:
      - local
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./services/auth-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      ENV_FILE_PATH: /app/.env
    volumes:
      # Mount .env from repo root so the app can load DATABASE_URL (avoids env_file issues)
      - ./.env:/app/.env:ro
    # No depends_on: with Supabase you run only this service (set DATABASE_URL).
    # With local Postgres use: docker compose --profile local up -d (auth-db starts first; allow a few seconds for DB to be ready).

volumes:
  auth-db-data:
