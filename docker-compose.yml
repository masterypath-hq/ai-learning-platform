# Database: use Supabase (set DATABASE_URL) or local Postgres (--profile local).
#   With Supabase:  docker compose up -d   (only auth-service; set DATABASE_URL in .env)
#   Local Postgres: docker compose --profile local up -d

services:
  auth-db:
    profiles:
      - local
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./services/auth-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      ENV_FILE_PATH: /app/.env
      REDIS_URL: redis://redis:6379
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy

  course-db:
    profiles:
      - local
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: course
    ports:
      - "5434:5432"
    volumes:
      - course-db-data:/var/lib/postgresql/data
      - ./services/course-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d course"]
      interval: 5s
      timeout: 5s
      retries: 5

  course-service:
    build:
      context: .
      dockerfile: services/course-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      ENV_FILE_PATH: /app/.env
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AUTH_SERVICE_URL: http://auth-service:3001
      AI_SERVICE_URL: http://ai-service:5002
      COURSE_SERVICE_URL: http://course-service:3003
      PROGRESS_SERVICE_URL: http://progress-service:5004
      ASSESSMENT_SERVICE_URL: http://assessment-service:5005
    depends_on:
      redis:
        condition: service_healthy

  ai-db:
    profiles:
      - local
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai
    ports:
      - "5435:5432"
    volumes:
      - ai-db-data:/var/lib/postgresql/data
      - ./services/ai-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      ENV_FILE_PATH: /app/.env
      JWT_SECRET: ${JWT_SECRET}
      COURSE_SERVICE_URL: http://course-service:3003
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy

  progress-service:
    build:
      context: .
      dockerfile: services/progress-service/Dockerfile
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      ENV_FILE_PATH: /app/.env
      REDIS_URL: redis://redis:6379
      COURSE_SERVICE_URL: http://course-service:3003
      ASSESSMENT_SERVICE_URL: http://assessment-service:5005
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy

  progress-db:
    profiles:
      - local
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: progress
      POSTGRES_PASSWORD: progress
      POSTGRES_DB: progress
    ports:
      - "5437:5432"
    volumes:
      - progress-db-data:/var/lib/postgresql/data
      - ./services/progress-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U progress -d progress"]
      interval: 5s
      timeout: 5s
      retries: 5

  assessment-db:
    profiles:
      - local
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: assessment
      POSTGRES_DB: assessment
    ports:
      - "5436:5432"
    volumes:
      - assessment-db-data:/var/lib/postgresql/data
      - ./services/assessment-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment -d assessment"]
      interval: 5s
      timeout: 5s
      retries: 5

  assessment-service:
    build:
      context: .
      dockerfile: services/assessment-service/Dockerfile
    ports:
      - "5005:5005"
    environment:
      PORT: 5005
      ENV_FILE_PATH: /app/.env
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:5002
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy

  websocket:
    build:
      context: .
      dockerfile: services/websocket/Dockerfile
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      ENV_FILE_PATH: /app/.env
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4001}
      NEXT_PUBLIC_PRO_PRICE_USD: ${NEXT_PUBLIC_PRO_PRICE_USD:-19}
      NEXT_PUBLIC_PRO_PRICE_NGN: ${NEXT_PUBLIC_PRO_PRICE_NGN:-25000}
      COURSE_SERVICE_URL: http://course-service:3003
    volumes:
      - ./frontend/app:/app/frontend/app
      - ./frontend/components:/app/frontend/components
      - ./frontend/lib:/app/frontend/lib
      - next-swc-cache:/root/.cache/next-swc
    depends_on:
      - gateway
      - course-service

volumes:
  auth-db-data:
  next-swc-cache:
  course-db-data:
  ai-db-data:
  assessment-db-data:
  progress-db-data:
  redis-data:
